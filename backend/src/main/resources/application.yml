server:
  port: 8080
  tomcat:
    max-swallow-size: -1
youtube:
  api:
    key: ${YOUTUBE_API_KEY:}
kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
llm:
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gpt-4o-mini}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1/chat/completions}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/resumematch_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 한 줄로 나오는 SQL을 예쁘게 줄바꿈해서 보여줍니다.
        highlight_sql: true # SQL 문법에 색깔을 입혀줍니다. (Spring Boot 3.x 이상)

    # 👇 SQL에 들어가는 실제 데이터 값(?)을 로그로 확인하기 위한 설정
    logging:
      level:
        org:
          hibernate:
            SQL:debug:
        org.hibernate.orm.jdbc.bind: trace
